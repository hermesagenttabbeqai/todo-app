<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="app-title">My Tasks</h1>
      <span class="active-count" id="active-count" aria-live="polite"></span>
    </header>

    <nav class="filter-bar" role="navigation" aria-label="Task filters">
      <button class="filter-btn filter-btn--active" data-filter="all" aria-pressed="true">All</button>
      <button class="filter-btn" data-filter="active" aria-pressed="false">Active</button>
      <button class="filter-btn" data-filter="completed" aria-pressed="false">Completed</button>
    </nav>

    <main class="task-section">
      <ul class="task-list" id="task-list" aria-label="Task list"></ul>
      <p class="empty-state" id="empty-state" aria-live="polite">No tasks yet. Add one below!</p>
    </main>

    <section class="add-task-section" aria-label="Add task">
      <form class="add-task-form" id="add-task-form" novalidate>
        <div class="form-row">
          <label for="task-title" class="visually-hidden">Task title</label>
          <input
            type="text"
            id="task-title"
            name="task-title"
            class="input input--text"
            placeholder="What needs to be done?"
            autocomplete="off"
            required
            aria-required="true"
          />
        </div>
        <div class="form-row form-row--inline">
          <label for="task-due" class="form-label">Due date</label>
          <input
            type="date"
            id="task-due"
            name="task-due"
            class="input input--date"
          />
          <button type="submit" class="btn btn--primary">Add</button>
        </div>
        <p class="form-error" id="form-error" role="alert" aria-live="assertive"></p>
      </form>
    </section>
  </div>

  <!-- Edit modal -->
  <div class="modal-backdrop" id="modal-backdrop" hidden aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 class="modal-title" id="modal-title">Edit Task</h2>
      <form class="modal-form" id="edit-task-form" novalidate>
        <input type="hidden" id="edit-task-id" />
        <div class="form-row">
          <label for="edit-title" class="form-label">Title</label>
          <input
            type="text"
            id="edit-title"
            class="input input--text"
            required
            aria-required="true"
          />
        </div>
        <div class="form-row">
          <label for="edit-due" class="form-label">Due date</label>
          <input
            type="date"
            id="edit-due"
            class="input input--date"
          />
        </div>
        <p class="form-error" id="edit-form-error" role="alert" aria-live="assertive"></p>
        <div class="modal-actions">
          <button type="button" class="btn btn--secondary" id="modal-cancel">Cancel</button>
          <button type="submit" class="btn btn--primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
